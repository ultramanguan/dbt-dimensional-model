version: 2

models:
  - name: fct_sales
    columns:

      - name: sales_key
        description: The surrogate key of the fct sales
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: The natural key of the saleorderheader
        data_tests:
          - not_null

      - name: sales_order_detail_id
        description: The natural key of the salesorderdetail
        data_tests:
          - not_null

      - name: product_key
        description: The foreign key of the product
        data_tests:
          - not_null

      - name: customer_key
        description: The foreign key of the customer
        data_tests:
          - not_null

      - name: ship_address_key
        description: The foreign key of the shipping address
        data_tests:
          - not_null

      - name: creditcard_key
        description: The foreign key of the creditcard. If no creditcard exists, it was assumed that purchase was made in cash.
        data_tests:
          - not_null

      - name: order_date_key
        description: The foreign key of the order date
        data_tests:
          - not_null

      - name: order_status_key
        description: The foreign key of the order status
        data_tests:
          - not_null

      - name: order_date
        description: The date the order was placed. The table is clustered on this column so date-range queries can prune files.
        data_tests:
          - not_null

      - name: modified_date
        description: The latest of the order header and order detail modified dates. Used as the watermark for incremental loads.
        data_tests:
          - not_null

      - name: unit_price
        description: The unit price of the product
        data_tests:
          - not_null

      - name: order_qty
        description: The quantity of the product
        data_tests:
          - not_null

      - name: revenue
        description: The revenue obtained by multiplying unit_price and order_qty

