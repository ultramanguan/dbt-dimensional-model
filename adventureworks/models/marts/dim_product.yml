version: 2

models:
  - name: dim_product
    columns:
      - name: product_key
        description: The surrogate key of the product
        data_tests:
          - not_null
          - unique
      - name: product_id
        description: The natural key of the product
        data_tests:
          - not_null
          - unique
      - name: product_name
        description: The product name
        data_tests:
          - not_null 
